# Packages SetShifter with the BigWigs packager when a GitHub release is
# published: attaches SetShifter-<tag>.zip to the release and uploads it to
# CurseForge (project ID from "## X-Curse-Project-ID" in SetShifter.toc).
# Files left out of the zip are listed in .pkgmeta.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the packager needs tags and history for the changelog

      - name: Check TOC version matches tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^## Version: *//p' SetShifter.toc | tr -d '\r')
          if [ "v$version" != "$TAG" ] && [ "$version" != "$TAG" ]; then
            echo "::error::SetShifter.toc says version $version, but the release tag is $TAG"
            exit 1
          fi

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
